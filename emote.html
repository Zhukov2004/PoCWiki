<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotes | Path of Champions Wiki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="font-injector.js"></script>
    <script src="components.js"></script>
    <style>
        body { background-color: #04060b; color: white; overflow-x: hidden; padding-top: 100px;}
        
        /* Custom Scrollbar */
        .glow-scrollbar::-webkit-scrollbar { width: 4px; }
        .glow-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        .glow-scrollbar::-webkit-scrollbar-thumb { background: rgba(251,146,60,0.3); border-radius: 10px; }
        
        .emote-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(251,146,60,0.15);
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header -->
    <div class="relative py-20 px-6">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-orange-500/10 via-transparent to-transparent"></div>
        <div class="max-w-7xl mx-auto relative z-10 text-center">
            <h1 class="text-5xl md:text-5xl font-black uppercase tracking-tighter mb-4 text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-500">
                Biểu cảm & Tương tác
            </h1>
        </div>
    </div>
    <div class="max-w-7xl mx-auto px-6 mb-12 relative z-20">
        <div class="flex flex-col md:flex-row gap-4 p-4 bg-[#0d111c]/80 border border-white/5 rounded-2xl backdrop-blur-xl">
            
            <!-- Tìm kiếm theo tên & mô tả -->
            <div class="relative flex-1 group">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500 group-focus-within:text-orange-400 transition-colors"></i>
                <input type="text" id="search-input" 
                       placeholder="Tìm kiếm tên emote hoặc mô tả..." 
                       class="w-full bg-[#04060b] border border-white/5 rounded-xl py-3 pl-12 pr-4 text-sm focus:outline-none focus:border-orange-500/50 transition-all">
            </div>
    
            <!-- Lọc theo độ hiếm -->
            <div class="relative w-full md:w-64 group">
                <i data-lucide="filter" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500 group-focus-within:text-orange-400"></i>
                <select id="rarity-filter" 
                        class="w-full bg-[#04060b] border border-white/5 rounded-xl py-3 pl-12 pr-4 text-sm focus:outline-none focus:border-orange-500/50 appearance-none transition-all cursor-pointer">
                    <option value="all">Tất cả độ hiếm</option>
                    <option value="Thường">Thường</option>
                    <option value="Hiếm">Hiếm</option>
                    <option value="Sử Thi">Sử Thi</option>
                    <option value="Huyền Thoại">Huyền Thoại</option>
                </select>
            </div>
        </div>
    </div>
    <!-- Container -->
    <main class="max-w-[1400px] mx-auto px-6">
        <div id="emotes-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-6">
            <!-- Dữ liệu từ emote.json sẽ được render vào đây -->
            <div class="col-span-full text-center py-20 opacity-50">
                <p>Đang tải bộ sưu tập biểu cảm...</p>
            </div>
        </div>
    </main>

    <script>
        async function loadEmotes() {
            try {
                // Đọc file emote.json
                const response = await fetch('emote.json');
                const emotes = await response.json();
                
                const grid = document.getElementById('emotes-grid');
                grid.innerHTML = ''; // Xóa trạng thái loading

                emotes.forEach(emote => {
                    // Thêm class flex và flex-col vào emote-card để kiểm soát không gian dọc
const card = `
    <div class="emote-card group relative bg-[#0d111c]/80 border border-white/5 rounded-2xl p-5 transition-all duration-300 hover:border-orange-500/40 flex flex-col h-full">
        <!-- Độ hiếm -->
        <div class="absolute top-4 left-4">
            <span class="text-[9px] font-bold uppercase tracking-widest text-slate-500 bg-white/5 px-2 py-1 rounded">
                ${emote.rarity}
            </span>
        </div>

        <!-- Ảnh Emote -->
        <div class="relative aspect-square mb-6 mt-4 flex items-center justify-center flex-shrink-0">
            <div class="absolute inset-0 bg-orange-500/5 rounded-full blur-2xl group-hover:bg-orange-500/10 transition-colors"></div>
            <img src="${emote.imgUrl}" 
                 alt="${emote.name}" 
                 class="w-full h-full object-contain relative z-10 transition-transform duration-500 group-hover:scale-110 group-hover:rotate-2"
                 loading="lazy">
        </div>

        <!-- Thông tin - flex-grow giúp phần này chiếm hết khoảng trống còn lại -->
        <div class="flex-grow flex flex-col gap-2 text-center relative z-10">
            <h3 class="text-white font-bold text-sm group-hover:text-orange-400 transition-colors">
                ${emote.name}
            </h3>
            
            <!-- Mô tả: Bỏ h-8 và line-clamp nếu muốn hiện đầy đủ, hoặc tăng line-clamp-4 -->
            <p class="text-slate-5 text-[14px] leading-relaxed">
                ${emote.description}
            </p>
        </div>

        <!-- Giá: mt-auto sẽ đẩy nó xuống sát đáy card bất kể mô tả dài hay ngắn -->
        <div class="pt-4 mt-auto text-center">
            <div class="inline-flex items-center gap-2 py-1.5 px-4 bg-orange-500/10 rounded-full border border-orange-500/10 group-hover:border-orange-500/30 transition-all">
                <i data-lucide="coins" class="w-3 h-3 text-orange-400"></i>
                <span class="text-[12px] font-black text-orange-400 tracking-tighter">
                    ${emote.price}
                </span>
            </div>
        </div>
    </div>
`;
                    grid.insertAdjacentHTML('beforeend', card);
                });

                // Khởi tạo lại các icon Lucide sau khi render
                lucide.createIcons();

            } catch (error) {
                console.error('Lỗi khi tải emote.json:', error);
                document.getElementById('emotes-grid').innerHTML = `
                    <div class="col-span-full text-center py-20 text-red-400">
                        Không thể tải dữ liệu. Hãy đảm bảo file emote.json nằm cùng thư mục.
                    </div>
                `;
            }
        }

        // Chạy hàm khi trang web sẵn sàng
        document.addEventListener('DOMContentLoaded', loadEmotes);
        let allEmotes = []; // Biến lưu trữ dữ liệu gốc từ json

    async function init() {
        try {
            const response = await fetch('emote.json');
            allEmotes = await response.json();
            renderEmotes(allEmotes);
            
            // Lắng nghe sự kiện nhập liệu
            document.getElementById('search-input').addEventListener('input', filterData);
            document.getElementById('rarity-filter').addEventListener('change', filterData);
            
            lucide.createIcons();
        } catch (error) {
            console.error('Lỗi tải dữ liệu:', error);
        }
    }

    function filterData() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        const rarityTerm = document.getElementById('rarity-filter').value;

        const filtered = allEmotes.filter(emote => {
            // Kiểm tra tên hoặc mô tả
            const matchesSearch = emote.name.toLowerCase().includes(searchTerm) || 
                                 emote.description.toLowerCase().includes(searchTerm);
            
            // Kiểm tra độ hiếm
            const matchesRarity = rarityTerm === 'all' || emote.rarity === rarityTerm;

            return matchesSearch && matchesRarity;
        });

        renderEmotes(filtered);
    }

    function renderEmotes(data) {
        const grid = document.getElementById('emotes-grid');
        grid.innerHTML = '';

        if (data.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-500 italic">Không tìm thấy biểu cảm nào khớp với yêu cầu...</div>`;
            return;
        }

        data.forEach(emote => {
            // Tận dụng cấu trúc render card ông đã có sẵn
            const card = `
                <div class="emote-card group relative bg-[#0d111c]/80 border border-white/5 rounded-2xl p-5 transition-all duration-300 hover:border-orange-500/40 flex flex-col h-full">
        <!-- Độ hiếm -->
        <div class="absolute top-4 left-4">
            <span class="text-[9px] font-bold uppercase tracking-widest text-slate-500 bg-white/5 px-2 py-1 rounded">
                ${emote.rarity}
            </span>
        </div>

        <!-- Ảnh Emote -->
        <div class="relative aspect-square mb-6 mt-4 flex items-center justify-center flex-shrink-0">
            <div class="absolute inset-0 bg-orange-500/5 rounded-full blur-2xl group-hover:bg-orange-500/10 transition-colors"></div>
            <img src="${emote.imgUrl}" 
                 alt="${emote.name}" 
                 class="w-full h-full object-contain relative z-10 transition-transform duration-500 group-hover:scale-110 group-hover:rotate-2"
                 loading="lazy">
        </div>

        <!-- Thông tin - flex-grow giúp phần này chiếm hết khoảng trống còn lại -->
        <div class="flex-grow flex flex-col gap-2 text-center relative z-10">
            <h3 class="text-white font-bold text-sm group-hover:text-orange-400 transition-colors">
                ${emote.name}
            </h3>
            
            <!-- Mô tả: Bỏ h-8 và line-clamp nếu muốn hiện đầy đủ, hoặc tăng line-clamp-4 -->
            <p class="text-slate-5 text-[14px] leading-relaxed">
                ${emote.description}
            </p>
        </div>

        <!-- Giá: mt-auto sẽ đẩy nó xuống sát đáy card bất kể mô tả dài hay ngắn -->
        <div class="pt-4 mt-auto text-center">
            <div class="inline-flex items-center gap-2 py-1.5 px-4 bg-orange-500/10 rounded-full border border-orange-500/10 group-hover:border-orange-500/30 transition-all">
                <i data-lucide="coins" class="w-3 h-3 text-orange-400"></i>
                <span class="text-[12px] font-black text-orange-400 tracking-tighter">
                    ${emote.price}
                </span>
            </div>
        </div>
    </div>
`;
            grid.insertAdjacentHTML('beforeend', card);
        });
        
        lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

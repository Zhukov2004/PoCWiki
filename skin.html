<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="font-injector.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Danh sách skin | Legends Of Runeterra Wiki</title>
    <style>
        :root {
            --bg-color: #0a0a0f;
            --card-bg: #1a1a24;
            --text-color: #e6e6e6;
            --sub-text: #b0b0b0;
            --accent-gold: #f0c05a;
            --border-gold: #5a442a;
            --rarity-epic: #9b59b6;
            --glow: 0 0 15px rgba(110, 215, 255, 0.4);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 100px;
        }

        /* --- HEADER WIKI --- */
        .wiki-header {
            width: 100%;
            max-width: 1200px;
            text-align: center;
            margin-bottom: 60px;
        }

        .header-line {
            height: 2px;
            background: linear-gradient(to right, transparent, var(--accent-gold), transparent);
            width: 100%;
        }

        .main-page-title {
            font-size: 3rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin: 20px 0 5px 0;
            letter-spacing: 6px;
            font-weight: 900;
        }

        /* --- GRID DANH SÁCH (2 CỘT) --- */
        .shop-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Ép đúng 2 cột */
            gap: 40px;
            width: 100%;
            max-width: 1300px;
        }

        .skin-item {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .skin-item:hover {
            transform: translateY(-8px);
            box-shadow: var(--glow);
            border-color: #6ed7ff;
        }

        .full-art-preview {
            width: 100%;
            height: 250px; /* Tăng chiều cao ảnh ở ngoài */
            object-fit: cover;
            object-position: center 20%;
        }

        .item-info-bar {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }

        .item-title {
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: 1px;
        }

        .corner-cards {
            position: absolute;
            bottom: 85px;
            left: 20px;
            display: flex;
            gap: 10px;
        }

        .mini-card-img {
            width: 65px;
            height: 100px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* --- MODAL KHỔNG LỒ --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-overlay.open { display: flex; }

        .modal-content {
            background-color: #16161e;
            border: 1px solid var(--border-gold);
            width: 95%;
            height: 90vh;
            max-width: 1600px;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .close-modal {
            position: absolute;
            top: 20px; right: 25px;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            z-index: 100;
        }

        /* VÙNG TRÁI: MEDIA (70%) */
        .modal-media {
    flex: 2.5; 
    background-color: #000;
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow: hidden; /* KHÓA CHẶT vùng này */
}

        .main-view {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #000; 
    overflow: hidden;
    padding: 10px; /* Tạo một khoảng thở nhỏ để ảnh không dính sát viền */
}

/* Ép ảnh và video luôn phải nằm gọn trong khung */
.main-view img, 
.main-view video {
    max-width: 100%;  /* Không được rộng quá khung */
    max-height: 100%; /* Không được cao quá khung */
    width: auto;      /* Tự tính chiều rộng theo tỉ lệ */
    height: auto;     /* Tự tính chiều cao theo tỉ lệ */
    object-fit: contain; /* Thần chú: Giữ nguyên tỉ lệ, thu nhỏ để nằm trọn trong khung */
    display: block;
}

        /* Container bọc ngoài */
        .gallery-thumbs {
    display: flex;
    gap: 10px;
    overflow-x: auto; /* Cuộn ngang */
    overflow-y: hidden; /* Cấm cuộn dọc/phình dọc */
    scroll-behavior: smooth;
    flex: 1;
    height: 100%; /* Ăn theo chiều cao của wrapper */
    align-items: center;
}
.gallery-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    margin-top: 15px;
    background: rgba(0, 0, 0, 0.3); /* Thêm nền tối nhẹ để phân biệt vùng gallery */
    padding: 5px;
    border-radius: 4px;
    height: 80px; /* Cố định chiều cao tổng của hàng gallery */
}
/* Ẩn thanh cuộn của trình duyệt để nhìn cho chuyên nghiệp */
.gallery-thumbs::-webkit-scrollbar {
    display: none;
}
.gallery-thumbs {
    -ms-overflow-style: none;  
    scrollbar-width: none;  
}

/* Style cho 2 nút mũi tên */
.nav-btn {
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent-gold);
    border: 1px solid var(--border-gold);
    padding: 10px 5px;
    cursor: pointer;
    z-index: 10;
    transition: 0.3s;
    font-size: 18px;
    height: 60px; /* Bằng chiều cao của thumb */
}

.nav-btn:hover {
    background: var(--accent-gold);
    color: #000;
}
.thumb.active {
    border-color: var(--accent-gold);
    opacity: 1;
    box-shadow: 0 0 10px var(--accent-gold);
}

.thumb:hover {
    opacity: 1;
}
/* Giữ cố định kích thước thumb để không bị méo khi cuộn */
.thumb {
    flex: 0 0 60px; /* Không cho co giãn */
    width: 60px;
    height: 60px;
    object-fit: cover;
    border: 2px solid transparent;
    cursor: pointer;
    transition: 0.2s;
    opacity: 0.6;
}

        /* VÙNG PHẢI: INFO (30%) */
        .modal-info {
            flex: 1;
            padding: 50px 40px;
            border-left: 1px solid var(--border-gold);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .modal-collection-name {
            color: var(--accent-gold);
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .modal-title {
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            line-height: 1.1;
        }

        .rarity-tag {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }


        .modal-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, var(--border-gold), transparent);
            margin-bottom: 30px;
        }

        .modal-description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--sub-text);
            margin-bottom: 40px;
        }

        .wiki-price-tag {
            margin-top: auto;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border: 1px solid var(--border-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-value {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .price-icon {
            width: 25px; height: 25px;
            background-color: var(--accent-gold);
            border-radius: 50%;
            margin-left: 10px;
        }

        @media (max-width: 1024px) {
            .shop-container { grid-template-columns: 1fr; }
            .modal-content { flex-direction: column; height: 95vh; }
            .modal-info { border-left: none; border-top: 1px solid var(--border-gold); }
        }
    </style>
</head>
<body>
    <script src="components.js"></script>
    <header class="wiki-header">
        <div class="header-line"></div>
        <h1 class="main-page-title">Danh sách skin</h1>
        <p style="color: var(--sub-text); letter-spacing: 2px;">
            ĐANG LƯU TRỮ: <span id="skinCount" style="color: var(--accent-gold); font-weight: bold;">0</span> TRANG PHỤC
        </p>
        <div class="header-line"></div>
    </header>
    <!-- --- SEARCH & FILTER BAR --- -->
<div class="search-filter-container" style="width: 100%; max-width: 1300px; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; margin-bottom: 40px;">
    <!-- Tìm theo tên -->
    <input type="text" id="searchName" placeholder="Tìm tên trang phục..." 
        style="background: var(--card-bg); border: 1px solid var(--border-gold); padding: 12px 20px; border-radius: 4px; color: white; outline: none;">
    
    <!-- Lọc theo bộ sưu tập -->
    <select id="filterCollection" style="background: var(--card-bg); border: 1px solid var(--border-gold); padding: 12px; border-radius: 4px; color: white; cursor: pointer;">
        <option value="">Tất cả bộ sưu tập</option>
    </select>

    <!-- Lọc theo độ hiếm -->
    <select id="filterRarity" style="background: var(--card-bg); border: 1px solid var(--border-gold); padding: 12px; border-radius: 4px; color: white; cursor: pointer;">
        <option value="">Tất cả độ hiếm</option>
    </select>
</div>
    <div class="shop-container" id="shopGrid">
        <p style="text-align:center; grid-column: 1/-1;">Đang kết nối kho dữ liệu...</p>
    </div>
    <!-- --- PAGINATION --- -->
<div id="paginationControls" style="margin-top: 50px; display: flex; gap: 10px; justify-content: center; align-items: center;">
    <!-- Nút bấm sẽ được tạo tự động bằng JS -->
</div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <div class="modal-media">
                <div class="main-view" id="modalMainView"></div>
    <p id="imageNameDisplay" style="text-align: center; color: var(--accent-gold); margin-top: 10px; font-weight: bold; letter-spacing: 1px;"></p>
    <div class="gallery-wrapper" style="position: relative; display: flex; align-items: center; margin-top: 15px;">
        <button id="prevBtn" class="nav-btn">❮</button>
        
        <div class="gallery-thumbs" id="modalGallery">
            </div>
        
        <button id="nextBtn" class="nav-btn">❯</button>
    </div>
            </div>
            <div class="modal-info">
                <p class="modal-collection-name" id="modalCollection"></p>
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="rarity-tag">
                    <span id="modalRarity"></span>
                </div>
                <div class="modal-divider"></div>
                <div class="modal-description" id="modalDesc"></div>
                <div class="wiki-price-tag">
                    <span style="letter-spacing: 2px; opacity: 0.7;">GIÁ SỞ HỮU</span>
                    <div class="price-value">
                        <span id="modalPriceText"></span>
                        <div class="price-icon"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modalOverlay');
const mainView = document.getElementById('modalMainView');
const gallery = document.getElementById('modalGallery');
const shopGrid = document.getElementById('shopGrid');

// Lắng nghe sự kiện lọc
document.getElementById('searchName').addEventListener('input', handleFilter);
document.getElementById('filterCollection').addEventListener('change', handleFilter);
document.getElementById('filterRarity').addEventListener('change', handleFilter);

// BIẾN TOÀN CỤC
let allSkins = [];      // Dữ liệu gốc từ JSON
let filteredSkins = []; // Dữ liệu sau khi lọc (Dùng để phân trang)
let currentPage = 1;    
const skinsPerPage = 6; 

// 1. Tải dữ liệu từ file JSON
async function loadSkins() {
    try {
        const response = await fetch('./skin.json');
        if (!response.ok) throw new Error("Không tìm thấy file skin.json");
        allSkins = await response.json();
        
        // Khởi tạo bộ lọc dropdown
        populateFilters(allSkins);
        
        // QUAN TRỌNG: Gán mặc định ban đầu
        filteredSkins = [...allSkins]; 
        
        // Hiển thị trang đầu tiên
        updateDisplay();
    } catch (error) {
        console.error("Lỗi:", error);
        shopGrid.innerHTML = `<p style="color:red; grid-column: 1/-1; text-align:center;">Lỗi kết nối dữ liệu: ${error.message}</p>`;
    }
}

// 2. Hàm trung tâm: Cập nhật số lượng, danh sách skin theo trang, và nút bấm phân trang
function updateDisplay() {
    const startIndex = (currentPage - 1) * skinsPerPage;
    const endIndex = startIndex + skinsPerPage;
    const skinsToDisplay = filteredSkins.slice(startIndex, endIndex);

    updateSkinCount(filteredSkins.length);
    renderShop(skinsToDisplay);
    renderPagination();
}

// 3. Logic tìm kiếm & Lọc
function handleFilter() {
    const nameQuery = document.getElementById('searchName').value.toLowerCase();
    const colQuery = document.getElementById('filterCollection').value;
    const rarQuery = document.getElementById('filterRarity').value;

    filteredSkins = allSkins.filter(skin => {
        const matchName = skin.displayName.toLowerCase().includes(nameQuery);
        const matchCol = colQuery === "" || skin.collection === colQuery;
        const matchRar = rarQuery === "" || skin.rarity === rarQuery;
        return matchName && matchCol && matchRar;
    });

    currentPage = 1; // Reset về trang 1 khi lọc
    updateDisplay();
}

// 4. Tạo nút phân trang
function renderPagination() {
    const paginationControls = document.getElementById('paginationControls');
    const totalPages = Math.ceil(filteredSkins.length / skinsPerPage);
    
    paginationControls.innerHTML = '';
    if (totalPages <= 1) return;

    for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        btn.style.cssText = `
            padding: 8px 16px;
            border: 1px solid var(--border-gold);
            background: ${i === currentPage ? 'var(--accent-gold)' : 'var(--card-bg)'};
            color: ${i === currentPage ? '#000' : 'white'};
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.3s;
        `;
        
        btn.onclick = () => {
            currentPage = i;
            updateDisplay();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        paginationControls.appendChild(btn);
    }
}

// 5. Hiển thị skin ra Grid
function renderShop(skins) {
    shopGrid.innerHTML = ''; 
    if (skins.length === 0) {
        shopGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; opacity:0.5;">Không tìm thấy trang phục nào...</p>';
        return;
    }

    skins.forEach(skin => {
        const item = document.createElement('div');
        item.className = 'skin-item';
        item.onclick = () => openModal(skin); 

        let miniCardsHTML = (skin.cardPreview || [])
            .map(card => `<img src="${card}" class="mini-card-img">`)
            .join('');

        item.innerHTML = `
            <img src="${skin.fullArt}" class="full-art-preview" alt="${skin.displayName}">
            <div class="corner-cards">${miniCardsHTML}</div>
            <div class="item-info-bar">
                <h4 class="item-title">${skin.displayName}</h4>
                <div class="price-value" style="font-size: 1rem;">
                    ${skin.price} <div class="price-icon" style="width:15px; height:15px;"></div>
                </div>
            </div>
        `;
        shopGrid.appendChild(item);
    });
}

// 6. Modal và Gallery (Giữ nguyên logic của ông nhưng làm sạch hơn)
function openModal(skin) {
    document.getElementById('modalCollection').innerHTML = `<span style="color: var(--accent-gold);">Bộ sưu tập:</span> ${skin.collection || "CƠ BẢN"}`;
    document.getElementById('modalTitle').innerText = skin.displayName;
    document.getElementById('modalRarity').innerText = skin.rarity;
    document.getElementById('modalDesc').innerText = skin.description;
    document.getElementById('modalPriceText').innerText = skin.price;

    mainView.innerHTML = ''; 
    gallery.innerHTML = ''; 
    const nameDisplay = document.getElementById('imageNameDisplay');
    if (nameDisplay) nameDisplay.innerText = '';

    // Xử lý Video
    let videoList = skin.levelUpVideo ? (Array.isArray(skin.levelUpVideo) ? skin.levelUpVideo : [skin.levelUpVideo]) : [];
    videoList.forEach((vUrl, index) => {
        let vName = videoList.length > 1 ? (index === 0 ? "THĂNG CẤP (LV2)" : "THĂNG HOA (LV3)") : "HOẠT ẢNH THĂNG CẤP";
        addThumb('video', '▶', vUrl, vName, index === 0);
        if (index === 0) setMainView('video', vUrl, vName);
    });

    // Xử lý Ảnh
    if (skin.gallery) {
        skin.gallery.forEach((item, i) => {
            const isImgActive = (videoList.length === 0 && i === 0);
            addThumb('image', item.url, item.url, item.name, isImgActive);
            if (isImgActive) setMainView('image', item.url, item.name);
        });
    }
    modal.classList.add('open');
}

function addThumb(type, content, url, name, isActive) {
    const thumb = document.createElement(type === 'image' ? 'img' : 'div');
    if (type === 'image') { thumb.src = content; } 
    else { 
        thumb.innerHTML = content; 
        thumb.style.cssText = "display:flex; justify-content:center; align-items:center; font-size:24px; color:white; background:#222;";
    }
    thumb.className = `thumb ${isActive ? 'active' : ''}`;
    thumb.onclick = () => setMainView(type, url, name, thumb);
    gallery.appendChild(thumb);
}

function setMainView(type, url, name, clickedThumb) {
    const nameDisplay = document.getElementById('imageNameDisplay');
    if (type === 'video') {
        mainView.innerHTML = `<video controls autoplay loop style="width:100%; height:100%;"><source src="${url}" type="video/mp4"></video>`;
    } else {
        mainView.innerHTML = `<img src="${url}">`;
    }
    if (nameDisplay) nameDisplay.innerText = name ? name.toUpperCase() : "";
    if (clickedThumb) {
        document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
        clickedThumb.classList.add('active');
    }
}

// Điều hướng Gallery
document.getElementById('nextBtn').onclick = () => gallery.scrollBy({ left: 200, behavior: 'smooth' });
document.getElementById('prevBtn').onclick = () => gallery.scrollBy({ left: -200, behavior: 'smooth' });

// Hàm hỗ trợ khác
function populateFilters(skins) {
    const colSelect = document.getElementById('filterCollection');
    const rarSelect = document.getElementById('filterRarity');
    const collections = [...new Set(skins.map(s => s.collection).filter(Boolean))];
    const rarities = [...new Set(skins.map(s => s.rarity).filter(Boolean))];

    collections.sort().forEach(c => colSelect.innerHTML += `<option value="${c}">${c}</option>`);
    rarities.sort().forEach(r => rarSelect.innerHTML += `<option value="${r}">${r}</option>`);
}

function updateSkinCount(count) {
    document.getElementById('skinCount').innerText = count;
}

document.getElementById('closeModal').onclick = () => { modal.classList.remove('open'); mainView.innerHTML = ''; };
window.onclick = (e) => { if (e.target == modal) { modal.classList.remove('open'); mainView.innerHTML = ''; } };

loadSkins();
    </script>
</body>
</html>

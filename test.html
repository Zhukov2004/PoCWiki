<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>LoR Champion Skins List</title>
    <style>
        :root {
            --wiki-bg: #f8f9fa;
            --wiki-border: #a2a9b1;
            --wiki-header: #eaecf0;
            --wiki-link: #0645ad;
            --gold-highlight: #fff5d7;
        }

        body {
            font-family: sans-serif;
            background-color: white;
            margin: 20px;
            color: #202122;
        }

        /* Khung Video Cố định ở góc màn hình để vừa cuộn vừa xem */
        #video-preview-container {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 400px;
            background: white;
            border: 1px solid var(--wiki-border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none; /* Hiện khi click */
        }

        #video-preview-container video {
            width: 100%;
            display: block;
        }

        .video-header {
            background: var(--wiki-header);
            padding: 8px;
            font-weight: bold;
            border-bottom: 1px solid var(--wiki-border);
            display: flex;
            justify-content: space-between;
        }

        /* Style Bảng chuẩn Wiki */
        .wikitable {
            background-color: #f8f9fa;
            color: #202122;
            margin: 1em 0;
            border: 1px solid var(--wiki-border);
            border-collapse: collapse;
            width: 100%;
            max-width: 1200px;
        }

        .wikitable th {
            background-color: var(--wiki-header);
            text-align: center;
        }

        .wikitable th, .wikitable td {
            border: 1px solid var(--wiki-border);
            padding: 0.4em 0.6em;
        }

        .wikitable tr:hover {
            background-color: var(--gold-highlight);
            cursor: pointer;
        }

        .rarity-epic { color: #d32f2f; font-weight: bold; } /* Ví dụ màu cho Epic */
        .rarity-rare { color: #1976d2; font-weight: bold; }

        .btn-view {
            color: var(--wiki-link);
            text-decoration: underline;
            font-weight: bold;
        }

        h1 { border-bottom: 1px solid var(--wiki-border); padding-bottom: 5px; }
    </style>
</head>
<body>

<h1>Danh sách Champion Skins (Video Level-up)</h1>

<div id="video-preview-container">
    <div class="video-header">
        <span id="skin-title">Level-up Preview</span>
        <span style="cursor:pointer" onclick="document.getElementById('video-preview-container').style.display='none'">✕</span>
    </div>
    <video id="main-player" controls autoplay>
        <source src="" type="video/webm">
    </video>
</div>

<table class="wikitable">
    <thead>
        <tr>
            <th>Card Code</th>
            <th>Champion</th>
            <th>Skin Name</th>
            <th>Availability</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="skin-table-body">
        </tbody>
</table>

<script>
    // Dữ liệu mẫu (Ông ném file JSON đã quét vào đây)
    const skinData = [
        { "cardCode": "01DE012", "champ": "Garen", "skinName": "Original", "videoUrl": "https://wiki.leagueoflegends.com/en-us/images/0/01/01DE012-levelup.webm" },
        { "cardCode": "01DE012", "champ": "Garen", "skinName": "Rugged", "videoUrl": "https://wiki.leagueoflegends.com/en-us/images/0/01/01DE012_Rugged-levelup.webm" },
        { "cardCode": "04SH047", "champ": "Akshan", "skinName": "Sentinel", "videoUrl": "https://wiki.leagueoflegends.com/en-us/images/d/d7/04SH047_Sentinel-levelup.webm" }
    ];

    const tableBody = document.getElementById('skin-table-body');
    const player = document.getElementById('main-player');
    const container = document.getElementById('video-preview-container');
    const title = document.getElementById('skin-title');

    function renderTable() {
        skinData.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align:center"><code>${item.cardCode}</code></td>
                <td><b>${item.champ}</b></td>
                <td>${item.skinName}</td>
                <td style="text-align:center">Available</td>
                <td style="text-align:center"><span class="btn-view">Xem Video</span></td>
            `;
            
            tr.onclick = () => {
                container.style.display = 'block';
                player.src = item.videoUrl;
                title.innerText = `${item.champ} - ${item.skinName}`;
                player.play();
            };
            
            tableBody.appendChild(tr);
        });
    }

    renderTable();
</script>

</body>
</html>

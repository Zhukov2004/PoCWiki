<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Cổ Vật | Legends Of Runeterra Wiki VN</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: #0f172a;
            --accent: #22d3ee; /* Màu xanh lục bảo cho cổ vật */
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            align-items: center;
        }

        .bento-container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
        }

        @media (max-width: 950px) {
            .bento-container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 32px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .title-section h1 { 
            font-size: 26px; 
            margin: 0 0 8px; 
            font-weight: 800; 
            background: linear-gradient(to right, #22d3ee, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search & List */
        .search-box {
            display: flex;
            align-items: center;
            background: #1e293b;
            border-radius: 16px;
            padding: 10px 16px;
            margin: 15px 0;
            border: 1px solid var(--border);
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            margin-left: 10px;
            outline: none;
            width: 100%;
        }

        .checkbox-container {
            flex-grow: 1;
            max-height: 450px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 8px;
        }

        .checkbox-container::-webkit-scrollbar { width: 4px; }
        .checkbox-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .relic-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 16px;
            background: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .relic-item:hover { background: #334155; border-color: var(--accent); }
        .relic-item input { margin-right: 15px; width: 18px; height: 18px; accent-color: var(--accent); }
        
        .relic-info { display: flex; flex-direction: column; }
        .relic-name { font-weight: 700; font-size: 14px; }
        .relic-rarity { font-size: 11px; color: var(--accent); text-transform: uppercase; }

        /* Wheel Area */
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .wheel-box {
            position: relative;
            width: 550px;
            height: 550px;
        }

        @media (max-width: 600px) { .wheel-box { width: 320px; height: 320px; } }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            width: 0; height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 45px solid #22d3ee;
            filter: drop-shadow(0 0 15px rgba(34, 211, 238, 0.6));
        }

        .spin-button {
            margin-top: 30px;
            background: linear-gradient(135deg, #0891b2 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 20px 80px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(8, 145, 178, 0.3);
            transition: 0.3s;
        }

        .spin-button:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(8, 145, 178, 0.5); }
        .spin-button:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }

        #result {
            margin-top: 25px;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
        }
    </style>
</head>
<body>

<div class="bento-container">
    <div class="card title-section">
        <h1>Vòng Quay Cổ Vật</h1>
        <p>Phân vân không biết lắp món nào? Hãy để định mệnh chọn giúp ní.</p>
        
        <div class="search-box">
            <i data-lucide="search" class="w-4 h-4"></i>
            <input type="text" id="relicSearch" placeholder="Tìm tên cổ vật..." oninput="filterRelics()">
        </div>

        <div class="checkbox-container" id="relicList">
            </div>
    </div>

    <div class="card wheel-section">
        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="1000" height="1000"></canvas>
        </div>
        <button class="spin-button" id="spinBtn" onclick="spin()">XOAY CỔ VẬT</button>
        <div id="result"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let relics = [];
    let selectedRelics = [];
    let currentRotation = 0;

    // Màu sắc theo tone xanh cyan/indigo của cổ vật
    // Hàm tạo màu đa sắc rực rỡ
function getColor(index, total) {
    // Chia 360 độ màu cho tổng số lượng cổ vật
    const hue = (index * (360 / total)); 
    return `hsl(${hue}, 70%, 50%)`; // Độ bão hòa 70%, Độ sáng 50% cho màu tươi
}

    async function init() {
        try {
            // Đọc dữ liệu từ file relics.json
            const res = await fetch('relics.json');
            relics = await res.json();
            
            const saved = JSON.parse(localStorage.getItem('selected_relics'));
            const listDiv = document.getElementById('relicList');

            relics.forEach(r => {
                const isChecked = saved ? saved.includes(r.name) : true;
                if(isChecked) selectedRelics.push(r.name);

                const item = document.createElement('label');
                item.className = 'relic-item';
                item.innerHTML = `
                    <input type="checkbox" value="${r.name}" ${isChecked ? 'checked' : ''}>
                    <div class="relic-info">
                        <span class="relic-name">${r.name}</span>
                        <span class="relic-rarity">${r.rarity || 'Cổ Vật'}</span>
                    </div>
                `;
                
                item.querySelector('input').addEventListener('change', (e) => {
                    if(e.target.checked) selectedRelics.push(e.target.value);
                    else selectedRelics = selectedRelics.filter(n => n !== e.target.value);
                    localStorage.setItem('selected_relics', JSON.stringify(selectedRelics));
                    drawWheel();
                });
                listDiv.appendChild(item);
            });
            drawWheel();
            lucide.createIcons();
        } catch(e) { console.error("Không tìm thấy file relics.json", e); }
    }

    function filterRelics() {
        const term = document.getElementById('relicSearch').value.toLowerCase();
        const items = document.querySelectorAll('.relic-item');
        items.forEach(item => {
            const name = item.querySelector('.relic-name').innerText.toLowerCase();
            item.style.display = name.includes(term) ? 'flex' : 'none';
        });
    }

    function drawWheel() {
        const n = selectedRelics.length;
        if (n === 0) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }

        const arc = (Math.PI * 2) / n;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = centerX - 40;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        selectedRelics.forEach((name, i) => {
            const angle = i * arc;
            ctx.beginPath();
            ctx.fillStyle = getColor(i, n);
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, angle, angle + arc);
            ctx.lineTo(centerX, centerY);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            let fontSize = n > 20 ? 14 : 20;
            ctx.font = `bold ${fontSize}px Inter`;
            ctx.fillText(name.length > 25 ? name.substring(0, 22) + '...' : name, radius - 40, 10);
            ctx.restore();
        });

        // Center circle
        ctx.beginPath();
        ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
        ctx.fillStyle = "#0f172a";
        ctx.fill();
        ctx.strokeStyle = "#22d3ee"; // Thay cho var(--accent)
        ctx.lineWidth = 4;
        ctx.stroke();
    }

    function spin() {
        if (selectedRelics.length === 0) return;
        const btn = document.getElementById('spinBtn');
        const result = document.getElementById('result');
        btn.disabled = true;
        result.innerText = "Đang triệu hồi cổ vật...";

        const spinDeg = Math.floor(Math.random() * 360) + 3600; 
        currentRotation += spinDeg;
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            btn.disabled = false;
            const actualDeg = (currentRotation % 360);
            const arcDeg = 360 / selectedRelics.length;
            const index = Math.floor((360 - actualDeg + 270) % 360 / arcDeg);
            const winner = selectedRelics[index];
            result.innerHTML = `💎 Nhận được: <span style="color: #22d3ee">${winner}</span> 💎`;
        }, 5000);
    }

    init();
</script>

</body>
</html>
